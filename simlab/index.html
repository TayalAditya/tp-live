<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening the lab</title>
<style>
  :root { --page: #eef1f5; --card: #fff; --ink: #172033; --muted: #6b7486; --rule: #d7dde7; --accent: #1f7a4d; }
  @media (prefers-color-scheme: dark) { :root { --page: #141a17; --card: #1c2420; --ink: #e8ece6; --muted: #9aa69d; --rule: #33413a; --accent: #6fcf97; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(440px, 100%); padding: 22px 24px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  a.btn, button { display: inline-block; margin: 4px 8px 0 0; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; }
  a.btn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening the lab</h1>
  <p id="note">Finding the lab Pi.</p>
  <div id="ways" hidden>
    <a class="btn main" id="campus" hidden>Open it on the campus Wi-Fi</a>
    <a class="btn" id="anyway" hidden>Try the public link anyway</a>
    <button id="again">Check again</button>
  </div>
</main>
<script>
/* This page lives at a fixed address. The lab Pi keeps a Cloudflare tunnel open and publishes
   where it is today in ../<this folder>.json; the page forwards there, carrying the query and the
   #hash (a shared project travels in the hash). ?gh goes to the app's admin page, /gh/. When the
   tunnel is down or the Pi has stopped reporting, it offers the campus link instead, with the same hash.
   An app may ask this page to remember who uses it on this phone: #remember=<key> keeps the key, #forget drops
   it, and every visit then carries it on as ?who=<key>. MakerBench does this so a student's work carries on
   whatever address the lab has that day. */
(function () {
  var page = location.pathname.replace(/\/+$/, '').split('/').pop();
  var $ = function (id) { return document.getElementById(id); };
  var bust = function (u) { return u + '?t=' + Date.now(); };
  var admin = /^\?gh\/?$/.test(location.search), path = admin ? '/gh/' : '/', qs = admin ? '' : location.search;
  var hash = location.hash, who = null;
  try {
    var keep = /^#remember=([a-z0-9-]{3,64})$/.exec(hash);
    if (keep) { localStorage.setItem('who:' + page, keep[1]); hash = ''; }
    else if (hash === '#forget') { localStorage.removeItem('who:' + page); hash = ''; }
    who = localStorage.getItem('who:' + page);
  } catch (e) { }
  if (who && !admin && !/[?&]who=/.test(qs)) qs += (qs ? '&' : '?') + 'who=' + encodeURIComponent(who);
  function get(u) { return fetch(bust(u), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function show(info, quiet) {
    var name = (info && info.name) || 'The lab';
    document.title = name;
    $('title').textContent = name + ' is not reachable from outside the campus right now';
    $('note').textContent = quiet ? 'The lab Pi has not reported for a while, so it may be switched off or offline.' : 'The lab Pi is on, but its public link is down at the moment. It reconnects by itself, usually within a few minutes.';
    if (info && info.campus) { $('campus').href = info.campus + qs + hash; $('campus').hidden = false; }
    if (info && info.lastUrl) { $('anyway').href = info.lastUrl + path + qs + hash; $('anyway').hidden = false; }
    $('ways').hidden = false;
  }
  function go() {
    Promise.all([get('../' + page + '.json'), get('../services.json').catch(function () { return null; })]).then(function (r) {
      var info = r[0], services = r[1];
      var checked = services && services.checked ? Date.parse(String(services.checked).replace(' UTC', 'Z').replace(' ', 'T')) : NaN;
      var stale = !isNaN(checked) && Date.now() - checked > 45 * 60 * 1000;
      if (info.up && info.url && !stale) { location.replace(info.url + path + qs + hash); return; }
      if (info.url) info.lastUrl = info.url;
      show(info, stale);
    }).catch(function () { show({ campus: page === 'atalbench' ? '../atl/' : null }, false); $('note').textContent = 'The address of the lab Pi could not be read. Check the internet connection and try again.'; });
  }
  $('again').addEventListener('click', function () { $('ways').hidden = true; $('note').textContent = 'Checking again.'; go(); });
  go();
})();
</script>
</body>
</html>
